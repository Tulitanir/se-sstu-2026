openapi: 3.0.3
info:
  title: Proctoring API
  version: 1.0.0
servers:
  - url: https://api.example.com/v1
    description: Production API v1

paths:
  /media-sessions:
    post:
      summary: Создать медиасессию
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: Уникальный ключ идемпотентности клиента (UUID).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - student_id
                - exam_id
              properties:
                student_id:
                  type: string
                  description: ID студента из SSO
                exam_id:
                  type: string
                  description: ID экзамена
                settings:
                  type: object
                  properties:
                    record_video:
                      type: boolean
                      default: true
                    screenshot_interval_sec:
                      type: integer
                      minimum: 1
                      maximum: 300
                      default: 10
                    audio_enabled:
                      type: boolean
                      default: true
      responses:
        '200':
          description: Сессия создана 
          headers:
            X-Idempotent-Replayed:
              schema:
                type: boolean
              description: true, если ответ возвращён по идемпотентности
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaSession'
        '400':
          description: Некорректные параметры запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Необходима аутентификация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Доступ запрещён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Слишком много запросов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Сервер недоступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      summary: Список медиасессий
      parameters:
        - name: student_id
          in: query
          schema:
            type: string
          description: Фильтр по студенту
        - name: exam_id
          in: query
          schema:
            type: string
          description: Фильтр по экзамену
        - name: status
          in: query
          schema:
            type: string
            enum: [active, paused, completed, failed]
          description: Статус сессии
        - name: from_date
          in: query
          schema:
            type: string
            format: date-time
          description: Начало периода
        - name: to_date
          in: query
          schema:
            type: string
            format: date-time
          description: Конец периода
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MediaSession'
                  pagination:
                    type: object
                    properties:
                      limit:
                        type: integer
                      offset:
                        type: integer
                      total:
                        type: integer
        '400':
          description: Неверные параметры фильтрации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Необходима аутентификация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно прав для просмотра списка сессий
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Сервер недоступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /media-sessions/{session_id}:
    get:
      summary: Получить медиасессию по ID
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
          description: UUID сессии
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaSession'
        '400':
          description: Некорректный формат session_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Необходима аутентификация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Доступ запрещён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Сессия не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Сервер недоступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Обновить статус сессии
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
          description: |
            ETag текущей версии ресурса.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [active, paused]
                  description: Новый статус сессии
                reason:
                  type: string
                  description: Причина изменения статуса
      responses:
        '200':
          description: Статус обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaSession'
        '400':
          description: Некорректный статус или тело запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Необходима аутентификация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Нет прав на изменение статуса этой сессии
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Сессия не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Некорректный переход статуса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '412':
          description: If-Match не совпадает (ресурс изменён другим клиентом)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Сервер недоступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Завершить медиасессию
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Сессия завершена
        '400':
          description: Некорректный ID сессии
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Необходима аутентификация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Нет прав на завершение этой сессии
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Сессия не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Сервер недоступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /anticheat/events:
    post:
      summary: Отправить событие античита
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: Уникальный ключ идемпотентности клиента (UUID).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnticheatEvent'
      responses:
        '200':
          description: Принято в обработку
          headers:
            X-Idempotent-Replayed:
              schema:
                type: boolean
              description: true, если событие уже обрабатывалось ранее
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Необходима аутентификация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Доступ запрещён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Указанная session_id не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Превышен лимит отправки событий
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Сервер недоступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /processed/events:
    post:
      summary: Отправить проверенное событие
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: Уникальный ключ идемпотентности клиента (UUID)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessedProctoringEvent'
      responses:
        '200':
          description: Принято в обработку
          headers:
            X-Idempotent-Replayed:
              schema:
                type: boolean
              description: true, если решение уже обрабатывалось ранее
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Необходима аутентификация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Доступ запрещён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Исходное событие или сессия не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Решение для этого event_id уже принято с другими данными
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Сервер недоступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    MediaSession:
      type: object
      properties:
        session_id:
          type: string
        student_id:
          type: string
        exam_id:
          type: string
        status:
          type: string
          enum: [active, paused, completed, failed]
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          nullable: true
        stream_url:
          type: string
        etag:
          type: string
          description: ETag ресурса для If-Match 

    AnticheatEvent:
      type: object
      required:
        - event_id
        - session_id
        - event_type
        - severity
        - detected_at_unix_ms
      properties:
        event_id:
          type: string
          description: UUID события
        session_id:
          type: string
        event_type:
          type: string
        event_data_json:
          type: string
          format: json
        severity:
          type: string
          enum:
            - INFO
            - WARNING
            - SUSPICIOUS
            - CRITICAL
        detected_at_unix_ms:
          type: integer
          format: int64
        offset_from_start_ms:
          type: integer
          format: int64

    ProcessedProctoringEvent:
      type: object
      required:
        - event_id
        - session_id
        - decision
      properties:
        event_id:
          type: string
        session_id:
          type: string
        decision:
          type: object
          required:
            - decision_id
            - proctor_id
            - type
            - decided_at_unix_ms
          properties:
            decision_id:
              type: string
            proctor_id:
              type: string
            type:
              type: string
              enum:
                - WARNING
                - VIOLATION_CONFIRM
                - VIOLATION_REJECT
                - EXAM_TERMINATE
                - ESCALATE_MANUAL
            comment:
              type: string
            decided_at_unix_ms:
              type: integer
              format: int64

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Уникальный код ошибки
        message:
          type: string
          description: Человекочитаемое описание ошибки
        details:
          type: object
          description: Дополнительная информация об ошибке
          additionalProperties: true
          example:
            field: "student_id"
            reason: "already has active session"
        timestamp:
          type: string
          format: date-time
          description: Время возникновения ошибки (UTC)